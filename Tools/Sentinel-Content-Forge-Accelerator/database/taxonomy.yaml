retrievalInference:
  scoring:
    sourceTerm: 8
    fieldTerm: 4
    textTerm: 3
    titlePathTerm: 2
    entityType: 1
    maximumMatchesPerSignal: 2
  thresholds:
    highScore: 8
    mediumScore: 5
    secondaryMinimumScore: 6
    secondaryMaximumDifference: 3
    maximumSchemas: 2
  metadataDomainFallbacks:
    Security - Network: NetworkSession
    Networking: NetworkSession
    Identity: Authentication
    User Behavior (UEBA): Authentication
    Cloud Provider: AuditEvent
    Security - Cloud Security: AuditEvent
    Compliance: AuditEvent
    DevOps: AuditEvent
    Application: WebSession
    Storage: FileEvent
    Security - Information Protection: FileEvent
    Security - Vulnerability Management: AssetEntity
    IT Operations: AssetEntity
    Security - Threat Intelligence: AlertEvent
    Security - Threat Protection: AlertEvent
    Security - Insider Threat: AuditEvent
    Security - Others: AlertEvent
    Internet of Things (IoT): AssetEntity
    Security - Automation (SOAR): AlertEvent
  contentTypeFallbacks:
    analyticRule: AlertEvent
    huntingQuery: AlertEvent
    workbook: AuditEvent
    parser: AuditEvent

