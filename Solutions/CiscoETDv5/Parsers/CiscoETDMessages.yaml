id: 5d2d65f3-66cf-4a64-8f3f-8f2dd7714c3a
Function:
  Title: Parser for Cisco ETD Messages
  Version: '1.0.0'
  LastUpdated: '2026-03-06'
Category: Microsoft Sentinel Parser
FunctionName: CiscoETDMessages
FunctionAlias: CiscoETDMessages
FunctionQuery: |
  CiscoETD_CL
  | extend downloadLink = tostring(downloadLink)
  | extend _messageEnvelope = todynamic(message)
  | extend _messageArray = case(
      gettype(_messageEnvelope) == "array", _messageEnvelope,
      gettype(_messageEnvelope["message"]) == "array", _messageEnvelope["message"],
      isnotnull(_messageEnvelope["message"]), pack_array(_messageEnvelope["message"]),
      pack_array(_messageEnvelope)
    )
  | mv-expand messageItem = _messageArray
  | extend message = todynamic(messageItem)
  | extend EventTime = coalesce(
      todatetime(message["timestamp"]),
      todatetime(message["time"]),
      todatetime(message["eventTime"]),
      TimeGenerated
    )
  | extend MessageId = tostring(coalesce(message["messageId"], message["id"], message["mid"]))
  | extend Verdict = tostring(coalesce(message["verdict"]["verdict"], message["verdict"]["category"], message["verdict"], message["disposition"], message["action"]["action"], message["action"]))
  | extend Sender = tostring(coalesce(message["sender"], message["from"], message["senderAddress"], message["fromAddresses"], message["returnPath"]))
  | extend Recipient = tostring(coalesce(message["recipient"], message["to"], message["recipientAddress"], message["toAddresses"][0], message["envelopeTo"][0]))
  | extend Subject = tostring(message["subject"])
  | project TimeGenerated, EventTime, downloadLink, MessageId, Verdict, Sender, Recipient, Subject, message